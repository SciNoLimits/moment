orchestrator_node:
  ros__parameters:

    # Home / cube detection station
    home:
      x: 0.0
      y: 0.0
      yaw: 0.0

    # Red cube destination
    red_bay:
      x: -4.7
      y: 7.95
      yaw: 1.57079632679

    # Green cube destination
    green_bay:
      x: -0.35
      y: 8.10
      yaw: 1.57079632679

    # Blue cube destination
    blue_bay:
      x: 3.735
      y: 8.6
      yaw: 0.0

    # Navigation frame
    global_frame: "map"

    # Perception and manipulation frame
    robot_frame: "base_footprint"

    # Pick height offset
    pick_z_offset: 0.089

    # Approach distance to cube before picking
    preferred_pick_x: 0.240 # Max range is within 0.30
    approach_tolerance: 0.08
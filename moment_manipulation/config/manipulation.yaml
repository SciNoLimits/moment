manipulation_server:
  ros__parameters:
    use_sim_time: true

    # Names from moment_moveit_config/config/moment.srdf.
    arm_group: moment_arm
    hand_group: moment_gripper
    tcp_link: end_effector_link
    home_target: home
    place_target: place
    open_target: open
    closed_target: close

    # Distances along +Z of the MoveIt planning frame, in metres.
    approach_distance: 0.08
    grasp_z_offset: 0.0
    cartesian_step: 0.005
    velocity_scaling: 0.15
    acceleration_scaling: 0.15

    # Optional fixed TCP quaternion [x, y, z, w] in the planning frame.
    # If omitted, Pick uses the object's transformed orientation.
    # grasp_orientation_xyzw: [1.0, 0.0, 0.0, 0.0]
